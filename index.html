<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Tools & AI Workspace</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --meta: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --accent: #8b5cf6;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .wrapper {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 768px) {
            .wrapper { grid-template-columns: 1.2fr 0.8fr; }
        }
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        h2, h3 { margin-top: 0; color: var(--text); }
        input, button {
            width: 100%;
            padding: 10px 14px;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .logout-btn { background-color: #ef4444; }
        .chat-box {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .send-btn { background-color: var(--accent); }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Left Column: Directory & Auth -->
        <div class="card">
            <h2>🎓 Student Directory</h2>
            <p style="color: var(--meta); font-size: 0.9rem;">Access your tools, resources, and custom submissions.</p>
            
            <div id="authSection" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                <div id="loggedOutView">
                    <h3>Sign In</h3>
                    <input type="text" id="usernameInput" placeholder="Enter your name...">
                    <button id="loginBtn">Start Session</button>
                </div>
                <div id="loggedInView" style="display: none;">
                    <h3 id="greetingText"></h3>
                    <button class="logout-btn" id="logoutBtn">Log Out</button>
                </div>
            </div>
        </div>

        <!-- Right Column: AI Assistant Panel -->
        <div class="card">
            <h2>💡 Study Assistant</h2>
            <p style="color: var(--meta); font-size: 0.9rem;">Ask questions or get workflow recommendations.</p>
            
            <div class="chat-box" id="chatLog">
                <strong>Assistant:</strong> Hello! How can I help with your studies today?
            </div>
            
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">Send Message</button>
        </div>
    </div>

    <script>
        // Core state logic
        let currentUser = localStorage.getItem('student_current_user') || '';

        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const sendBtn = document.getElementById('sendBtn');
        const usernameInput = document.getElementById('usernameInput');
        const chatInput = document.getElementById('chatInput');
        const chatLog = document.getElementById('chatLog');
        const loggedOutView = document.getElementById('loggedOutView');
        const loggedInView = document.getElementById('loggedInView');
        const greetingText = document.getElementById('greetingText');

        function updateUI() {
            if (currentUser) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'block';
                greetingText.innerText = 'Welcome, ' + currentUser + '!';
            } else {
                loggedOutView.style.display = 'block';
                loggedInView.style.display = 'none';
            }
        }

        // Event Listeners for clean interaction
        loginBtn.addEventListener('click', () => {
            let name = usernameInput.value.trim();
            if (!name) return;
            currentUser = name;
            localStorage.setItem('student_current_user', currentUser);
            usernameInput.value = '';
            updateUI();
        });

        logoutBtn.addEventListener('click', () => {
            currentUser = '';
            localStorage.removeItem('student_current_user');
            updateUI();
        });

        sendBtn.addEventListener('click', () => {
            let text = chatInput.value.trim();
            if (!text) return;

            chatLog.innerHTML += `<br><br><strong>You:</strong> ${text}`;
            chatInput.value = '';
            chatLog.scrollTop = chatLog.scrollHeight;

            setTimeout(() => {
                chatLog.innerHTML += `<br><br><strong>Assistant:</strong> I received your note about "${text}". Let's get it solved!`;
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 400);
        });

        // Initialize view on load
        updateUI();
    </script>
</body>
</html>
