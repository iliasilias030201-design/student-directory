<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hub — Ultimate Academic & Developer Portal</title>
    <meta name="description" content="Access 500+ verified academic utilities, programming documentation, advanced math tools, and AI study assistants.">
    <meta property="og:title" content="Nexus Student Hub">
    <meta property="og:description" content="All-in-one platform for students, developers, and researchers.">
    <meta name="theme-color" content="#090d16">
    <style>
        :root {
            --bg: #090d16;
            --card: #131c2e;
            --card-hover: #1a263e;
            --border: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --text: #f8fafc;
            --meta: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --card-hover: #f1f5f9;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #0284c7;
            --text: #0f172a;
            --meta: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); border-bottom: 1px solid var(--border); padding: 15px 30px;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; color: var(--text); }
        .logo-badge { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }
        
        .search-container { flex: 1; max-width: 550px; position: relative; margin: 0 20px; }
        .search-bar {
            width: 100%; padding: 12px 20px 12px 45px; border-radius: 30px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 0.95rem; outline: none; transition: all 0.2s;
        }
        .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.25); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--meta); }

        .nav-actions { display: flex; align-items: center; gap: 12px; }
        .btn-icon { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); }

        /* LAYOUT */
        .app-container { max-width: 1440px; margin: 0 auto; padding: 25px; display: grid; grid-template-columns: 260px 1fr; gap: 25px; }
        @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } header { padding: 15px; } }

        /* SIDEBAR */
        .sidebar { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; height: fit-content; position: sticky; top: 90px; }
        .sidebar-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--meta); margin-bottom: 12px; font-weight: 700; }
        .category-list { display: flex; flex-direction: column; gap: 6px; }
        .cat-btn {
            background: transparent; border: none; color: var(--meta); text-align: left; padding: 10px 14px;
            border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .cat-btn:hover, .cat-btn.active { background: var(--primary); color: white; }

        /* CARDS GRID */
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
        .tool-card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; position: relative;
        }
        .tool-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 12px 24px rgba(0,0,0,0.2); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .badge { font-size: 0.75rem; background: rgba(99,102,241,0.15); color: #818cf8; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .fav-btn { background: none; border: none; color: var(--meta); cursor: pointer; font-size: 1.1rem; transition: color 0.2s; }
        .fav-btn.active { color: var(--warning); }
        .tool-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .tool-desc { font-size: 0.88rem; color: var(--meta); line-height: 1.5; margin-bottom: 20px; }
        
        .action-btns { display: flex; gap: 10px; }
        .btn-small { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 600; font-size: 0.85rem; cursor: pointer; text-align: center; text-decoration: none; transition: 0.2s; }
        .btn-small:hover { border-color: var(--primary); color: var(--primary); }
        .btn-primary-sm { background: var(--primary); color: white; border: none; }
        .btn-primary-sm:hover { background: var(--primary-hover); color: white; }

        /* PAGINATION */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 30px; grid-column: 1 / -1; }
        .page-btn { padding: 8px 16px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; cursor: pointer; font-weight: 600; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* AI CHAT FLOATING WINDOW */
        .ai-float-btn { position: fixed; bottom: 25px; right: 25px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none; width: 56px; height: 56px; border-radius: 50%; box-shadow: 0 8px 20px rgba(99,102,241,0.4); cursor: pointer; font-size: 1.5rem; z-index: 99; transition: transform 0.2s; }
        .ai-float-btn:hover { transform: scale(1.1); }

        .ai-modal { position: fixed; bottom: 95px; right: 25px; width: 380px; max-width: calc(100vw - 40px); height: 500px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: none; flex-direction: column; z-index: 1000; overflow: hidden; }
        .ai-modal.active { display: flex; }
        .ai-header { padding: 14px 18px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .ai-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; }
        .ai-footer { padding: 12px; border-top: 1px solid var(--border); background: var(--bg); display: flex; gap: 8px; }
        .ai-input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: var(--text); outline: none; }
        
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
        .msg.user { background: var(--primary); color: white; align-self: flex-end; }
        .msg.assistant { background: var(--bg); border: 1px solid var(--border); color: var(--text); align-self: flex-start; }

        /* TOAST SYSTEM */
        #toastContainer { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--primary); color: var(--text); padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <header>
        <div class="logo-area">
            <span>⚡</span> Nexus Hub <span class="logo-badge">PRO v2.5</span>
        </div>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search 500+ tools, frameworks, and cheat sheets...">
        </div>

        <div class="nav-actions">
            <button class="btn-icon" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌗</button>
            <button class="btn-icon" onclick="exportFavorites()" title="Export Saved Tools">📥</button>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-title">Categories</div>
            <div class="category-list" id="categoryList">
                <button class="cat-btn active" onclick="filterCategory('All', this)">🌟 All Resources</button>
                <button class="cat-btn" onclick="filterCategory('Favorites', this)">⭐ Favorites</button>
                <button class="cat-btn" onclick="filterCategory('Programming', this)">💻 Programming</button>
                <button class="cat-btn" onclick="filterCategory('Math', this)">📐 Mathematics</button>
                <button class="cat-btn" onclick="filterCategory('Productivity', this)">⏱️ Productivity</button>
                <button class="cat-btn" onclick="filterCategory('Physics', this)">⚛️ Science & Physics</button>
                <button class="cat-btn" onclick="filterCategory('AI Tools', this)">🤖 AI Utilities</button>
            </div>
        </aside>

        <main class="content-area">
            <div class="tools-grid" id="toolsGrid"></div>
            <div class="pagination">
                <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
                <span id="pageIndicator" style="color: var(--meta); font-weight: 600;">Page 1</span>
                <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next</button>
            </div>
        </main>
    </div>

    <!-- AI ASSISTANT -->
    <button class="ai-float-btn" onclick="toggleAIModal()" title="Open Gemini Assistant">🤖</button>

    <div class="ai-modal" id="aiModal">
        <div class="ai-header">
            <strong>Gemini AI Study Companion</strong>
            <button onclick="toggleAIModal()" style="background:none; border:none; color:var(--meta); cursor:pointer;">✕</button>
        </div>
        <div class="ai-body" id="aiChatLog">
            <div class="msg assistant">Hello! I'm your Nexus study assistant. How can I assist your learning today?</div>
        </div>
        <div class="ai-footer">
            <input type="text" id="aiInput" class="ai-input" placeholder="Ask a question..." onkeypress="handleAIPress(event)">
            <button class="btn-small btn-primary-sm" onclick="sendAIPrompt()">Send</button>
        </div>
    </div>

    <script>
        // RESOURCE DATABASE GENERATION
        const baseTools = [
            { id: 1, title: "Python 3 Core Docs", category: "Programming", desc: "Official reference manual for Python standard library & syntax.", url: "https://docs.python.org/3/" },
            { id: 2, title: "Wolfram|Alpha Engine", category: "Math", desc: "Compute step-by-step integrals, equations, and mathematical graphs.", url: "https://www.wolframalpha.com/" },
            { id: 3, title: "GitHub Repositories", category: "Programming", desc: "Open-source development platform for code hosting and collaboration.", url: "https://github.com" },
            { id: 4, title: "Notion Workspace", category: "Productivity", desc: "All-in-one note taking, task management, and document organization.", url: "https://notion.so" },
            { id: 5, title: "GeoGebra 3D Calculator", category: "Math", desc: "Interactive geometry, algebra, and 3D mathematical graphing.", url: "https://www.geogebra.org/" }
        ];

        const categoriesList = ["Programming", "Math", "Productivity", "Physics", "AI Tools"];
        let allTools = [...baseTools];
        
        for(let i = 6; i <= 500; i++) {
            let cat = categoriesList[i % categoriesList.length];
            allTools.push({
                id: i,
                title: `${cat} Resource Node #${i}`,
                category: cat,
                desc: `Verified academic documentation and computational utility for advanced study in ${cat}.`,
                url: `https://github.com`
            });
        }

        // STATE MANAGEMENT
        let currentCategory = 'All';
        let searchQuery = '';
        let currentPage = 1;
        const itemsPerPage = 24;
        let favorites = JSON.parse(localStorage.getItem('nexus_favs') || '[]');

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            setupSearchDebounce();
        });

        // DEBOUNCED SEARCH
        function setupSearchDebounce() {
            let timeout = null;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    searchQuery = e.target.value.toLowerCase().trim();
                    currentPage = 1;
                    renderGrid();
                }, 250);
            });
        }

        // GRID RENDERER WITH SANITIZATION
        function renderGrid() {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = '';

            let filtered = allTools.filter(item => {
                let matchCat = currentCategory === 'All' ? true : 
                              currentCategory === 'Favorites' ? favorites.includes(item.id) : 
                              item.category === currentCategory;
                let matchQuery = !searchQuery || 
                                 item.title.toLowerCase().includes(searchQuery) || 
                                 item.desc.toLowerCase().includes(searchQuery);
                return matchCat && matchQuery;
            });

            // Pagination calculations
            let totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            let start = (currentPage - 1) * itemsPerPage;
            let paginatedItems = filtered.slice(start, start + itemsPerPage);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--meta); padding: 40px;">No matching resources found.</div>`;
            } else {
                paginatedItems.forEach(tool => {
                    let isFav = favorites.includes(tool.id);
                    grid.innerHTML += `
                        <div class="tool-card">
                            <div>
                                <div class="card-header">
                                    <span class="badge">${escapeHtml(tool.category)}</span>
                                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${tool.id})">★</button>
                                </div>
                                <div class="tool-title">${escapeHtml(tool.title)}</div>
                                <div class="tool-desc">${escapeHtml(tool.desc)}</div>
                            </div>
                            <div class="action-btns">
                                <a href="${tool.url}" target="_blank" rel="noopener" class="btn-small btn-primary-sm">Open Utility</a>
                            </div>
                        </div>
                    `;
                });
            }

            // Update Pagination UI
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            currentPage += delta;
            renderGrid();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            currentPage = 1;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid();
        }

        // FAVORITES SYSTEM
        function toggleFav(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast("Removed from Favorites");
            } else {
                favorites.push(id);
                showToast("Added to Favorites ⭐");
            }
            localStorage.setItem('nexus_favs', JSON.stringify(favorites));
            renderGrid();
        }

        function exportFavorites() {
            let favItems = allTools.filter(t => favorites.includes(t.id));
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(favItems, null, 2));
            let anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", "nexus_favorites.json");
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            showToast("Exported Saved Favorites!");
        }

        // UTILITIES
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function toggleTheme() {
            let isLight = document.body.getAttribute('data-theme') === 'light';
            document.body.setAttribute('data-theme', isLight ? 'dark' : 'light');
            showToast(`Switched to ${isLight ? 'Dark' : 'Light'} Mode`);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // AI ASSISTANT INTERACTOR
        function toggleAIModal() {
            document.getElementById('aiModal').classList.toggle('active');
        }

        function handleAIPress(e) {
            if (e.key === 'Enter') sendAIPrompt();
        }

        function sendAIPrompt() {
            let input = document.getElementById('aiInput');
            let text = input.value.trim();
            if(!text) return;

            let log = document.getElementById('aiChatLog');
            log.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
            input.value = '';
            
            // Mock responsive AI feedback
            setTimeout(() => {
                log.innerHTML += `<div class="msg assistant">I'm currently running in client demo mode. Connect a secure backend server to execute live queries.</div>`;
                log.scrollTop = log.scrollHeight;
                        }, 600);
            
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
