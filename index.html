<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Student Directory & Workspace</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --meta: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --danger: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 900px) {
            .container { grid-template-columns: 1.4fr 0.6fr; }
        }
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        h2, h3 { margin-top: 0; color: var(--text); }
        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            margin-top: 6px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .danger-btn { background-color: var(--danger); }
        .chat-box {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 220px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .tool-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge {
            font-size: 0.75rem;
            background: var(--primary);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            width: fit-content;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Column: Directory & Custom Tool Submission -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <!-- Auth & Account Card -->
            <div class="card">
                <h3>🎓 Student Account</h3>
                <div id="loggedOutView">
                    <p style="color: var(--meta); font-size: 0.85rem; margin-bottom: 10px;">Enter your name to unlock custom tool submissions.</p>
                    <input type="text" id="usernameInput" placeholder="Your name...">
                    <button id="loginBtn">Sign In</button>
                </div>
                <div id="loggedInView" style="display: none;">
                    <p id="greetingText" style="font-weight: bold; margin-bottom: 10px;"></p>
                    <button class="danger-btn" id="logoutBtn">Log Out</button>
                </div>
            </div>

            <!-- Directory Card -->
            <div class="card">
                <h2>📚 Curated Tools Directory</h2>
                <input type="text" id="searchInput" placeholder="Search tools or resources...">
                
                <!-- Submission Section (Visible only when logged in) -->
                <div id="submitSection" style="display: none; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                    <h3>➕ Add Your Own Tool</h3>
                    <input type="text" id="newTitle" placeholder="Tool Name">
                    <select id="newCategory">
                        <option value="Programming">Programming</option>
                        <option value="Math">Math</option>
                        <option value="Productivity">Productivity</option>
                        <option value="Studying">Studying</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="newDesc" placeholder="Short description">
                    <input type="text" id="newUrl" placeholder="https://example.com">
                    <button id="addToolBtn" style="background-color: #10b981;">Publish Tool</button>
                </div>

                <div class="tools-grid" id="toolsList"></div>
            </div>
        </div>

        <!-- Right Column: Standalone AI Assistant Panel -->
        <div class="card" style="height: fit-content; position: sticky; top: 20px;">
            <h2>💡 Study Assistant</h2>
            <p style="color: var(--meta); font-size: 0.85rem; margin-bottom: 15px;">Ask questions or get tool recommendations.</p>
            
            <div class="chat-box" id="chatLog">
                <strong>Assistant:</strong> Hello! How can I help with your studies today?
            </div>
            
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button id="sendBtn" style="background-color: var(--accent);">Send</button>
        </div>
    </div>

    <script>
        // Expanded Curated Dataset
        const defaultTools = [
            { title: "Python Documentation", category: "Programming", desc: "Official Python language reference and tutorials.", url: "https://docs.python.org" },
            { title: "Wolfram|Alpha", category: "Math", desc: "Computational knowledge engine for equations and calculus.", url: "https://www.wolframalpha.com" },
            { title: "GitHub", category: "Programming", desc: "Host code, manage repositories, and collaborate.", url: "https://github.com" },
            { title: "Notion", category: "Productivity", desc: "All-in-one workspace for notes, tasks, and study planning.", url: "https://www.notion.so" },
            { title: "GeoGebra", category: "Math", desc: "Interactive geometry, algebra, statistics and calculus application.", url: "https://www.geogebra.org" },
            { title: "Stack Overflow", category: "Programming", desc: "Community-driven Q&A platform for programmers and developers.", url: "https://stackoverflow.com" },
            { title: "Desmos", category: "Math", desc: "Advanced online graphing calculator for mathematics.", url: "https://www.desmos.com" },
            { title: "LeetCode", category: "Programming", desc: "Platform to help you enhance your coding skills and practice algorithms.", url: "https://leetcode.com" },
            { title: "Anki", category: "Studying", desc: "Powerful, intelligent flashcard program utilizing spaced repetition.", url: "https://apps.ankiweb.net" },
            { title: "Obsidian", category: "Productivity", desc: "Powerful knowledge base that works on local Markdown files.", url: "https://obsidian.md" }
        ];

        let userTools = JSON.parse(localStorage.getItem('student_user_tools') || '[]');
        let currentUser = localStorage.getItem('student_current_user') || '';

        // DOM Elements
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const usernameInput = document.getElementById('usernameInput');
        const loggedOutView = document.getElementById('loggedOutView');
        const loggedInView = document.getElementById('loggedInView');
        const greetingText = document.getElementById('greetingText');
        const submitSection = document.getElementById('submitSection');
        
        const searchInput = document.getElementById('searchInput');
        const toolsList = document.getElementById('toolsList');
        
        const addToolBtn = document.getElementById('addToolBtn');
        const newTitle = document.getElementById('newTitle');
        const newCategory = document.getElementById('newCategory');
        const newDesc = document.getElementById('newDesc');
        const newUrl = document.getElementById('newUrl');

        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatLog = document.getElementById('chatLog');

        // Authentication State Management
        function updateAuthUI() {
            if (currentUser) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'block';
                greetingText.innerText = 'Welcome back, ' + currentUser + '! 👋';
                submitSection.style.display = 'block';
            } else {
                loggedOutView.style.display = 'block';
                loggedInView.style.display = 'none';
                submitSection.style.display = 'none';
            }
        }

        loginBtn.addEventListener('click', () => {
            let name = usernameInput.value.trim();
            if (!name) return;
            currentUser = name;
            localStorage.setItem('student_current_user', currentUser);
            usernameInput.value = '';
            updateAuthUI();
        });

        logoutBtn.addEventListener('click', () => {
            currentUser = '';
            localStorage.removeItem('student_current_user');
            updateAuthUI();
        });

        // Directory Rendering & Search
        function renderTools() {
            let query = searchInput.value.toLowerCase();
            let allTools = [...defaultTools, ...userTools];
            toolsList.innerHTML = '';

            let filtered = allTools.filter(t => 
                t.title.toLowerCase().includes(query) || 
                t.desc.toLowerCase().includes(query) || 
                t.category.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                toolsList.innerHTML = '<p style="color: var(--meta); grid-column: 1/-1;">No tools found.</p>';
                return;
            }

            filtered.forEach(tool => {
                toolsList.innerHTML += `
                    <div class="tool-card">
                        <div>
                            <span class="badge">${tool.category}</span>
                            <h3 style="margin: 10px 0 6px 0; font-size: 1.05rem;">${tool.title}</h3>
                            <p style="font-size: 0.85rem; color: var(--meta); margin: 0 0 15px 0;">${tool.desc}</p>
                        </div>
                        <a href="${tool.url}" target="_blank" style="background: var(--border); color: var(--text); text-align: center; padding: 8px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold;">Open Resource →</a>
                    </div>
                `;
            });
        }

        searchInput.addEventListener('input', renderTools);

        // Add Custom Tool
        addToolBtn.addEventListener('click', () => {
            let title = newTitle.value.trim();
            let category = newCategory.value;
            let desc = newDesc.value.trim();
            let url = newUrl.value.trim();

            if (!title || !desc || !url) {
                alert('Please fill in all tool fields.');
                return;
            }

            let newTool = { title, category, desc, url };
            userTools.push(newTool);
            localStorage.setItem('student_user_tools', JSON.stringify(userTools));

            newTitle.value = '';
            newDesc.value = '';
            newUrl.value = '';

            renderTools();
            alert('Tool published successfully!');
        });

        // Assistant Interaction
        function handleAssistantSend() {
            let text = chatInput.value.trim();
            if (!text) return;

            chatLog.innerHTML += `<br><br><strong>You:</strong> ${text}`;
            chatInput.value = '';
            chatLog.scrollTop = chatLog.scrollHeight;

            setTimeout(() => {
                chatLog.innerHTML += `<br><br><strong>Assistant:</strong> I've noted your request about "${text}". Check out the directory categories above to find matching resources!`;
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 400);
        }

        sendBtn.addEventListener('click', handleAssistantSend);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAssistantSend();
        });

        // Initial Load
        updateAuthUI();
        renderTools();
    </script>
</body>
</html>
