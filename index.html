<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Nexus Hub — a curated portal for academic, developer, research and AI resources.">
<title>Nexus Hub — Academic & Developer Portal</title>
<style>
:root{
  --bg:#080c16;--surface:#111827;--surface2:#172033;--surface3:#1d2940;
  --border:#2b3952;--text:#f8fafc;--muted:#b8c4d6;--primary:#6366f1;
  --primary2:#4f46e5;--accent:#06b6d4;--success:#10b981;--warning:#f59e0b;
  --danger:#ef4444;--shadow:0 16px 40px rgba(0,0,0,.28);--radius:14px;
}
[data-theme="light"]{
  --bg:#f4f7fb;--surface:#fff;--surface2:#f1f5f9;--surface3:#e8eef7;
  --border:#c8d2e1;--text:#0f172a;--muted:#475569;--primary:#4f46e5;
  --primary2:#4338ca;--accent:#0284c7;--shadow:0 12px 32px rgba(15,23,42,.12)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(99,102,241,.38);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
header{
  position:sticky;top:0;z-index:50;display:grid;grid-template-columns:auto minmax(260px,1fr) auto;
  gap:18px;align-items:center;padding:12px max(18px,calc((100vw - 1440px)/2));
  background:color-mix(in srgb,var(--surface) 90%,transparent);border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px)
}
.logo{display:flex;align-items:center;gap:9px;font-weight:850;font-size:1.18rem;white-space:nowrap}
.badge-pro{font-size:.68rem;padding:4px 7px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--accent));color:white}
.search-wrap{position:relative}
.search{width:100%;height:44px;padding:0 44px;border:1px solid var(--border);border-radius:24px;background:var(--bg);color:var(--text)}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.header-actions{display:flex;gap:8px}
.icon-btn{
  width:42px;height:42px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text)
}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.app{max-width:1440px;margin:auto;padding:24px 20px 110px;display:grid;grid-template-columns:240px 1fr;gap:22px}
.sidebar{position:sticky;top:82px;align-self:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.sidebar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sidebar-title{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800}
.cat-list{display:grid;gap:5px}
.cat{
  width:100%;border:0;background:transparent;color:var(--muted);padding:10px 11px;border-radius:9px;text-align:left;
  display:flex;justify-content:space-between;align-items:center
}
.cat:hover{background:var(--surface2);color:var(--text)}
.cat.active{background:var(--primary);color:white}
.count{font-size:.72rem;opacity:.75}
.content-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.result-count{color:var(--muted);font-size:.88rem}
.controls{display:flex;gap:8px}
.select{height:38px;padding:0 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}
.card{
  min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;
  display:flex;flex-direction:column;min-height:245px;transition:transform .18s,border-color .18s,box-shadow .18s
}
.card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:750;padding:4px 8px;border-radius:20px;background:rgba(99,102,241,.14);color:#a5b4fc}
.fav{border:0;background:transparent;color:var(--muted);font-size:1.2rem;padding:2px}
.fav.active{color:var(--warning)}
.title{font-size:1.03rem;font-weight:800;margin:13px 0 7px}
.desc{color:var(--muted);font-size:.85rem;line-height:1.5;margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;margin-bottom:15px}
.meta .chip{background:var(--surface2);color:var(--muted);font-weight:650}
.verified{color:var(--success)!important;background:rgba(16,185,129,.11)!important}
.domain{font-size:.72rem;color:var(--muted);padding:5px 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open{
  display:flex;align-items:center;justify-content:center;min-height:40px;text-decoration:none;border-radius:9px;
  background:var(--primary);color:white;font-weight:750;font-size:.84rem
}
.open:hover{background:var(--primary2)}
.empty{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted)}
.pagination{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:22px}
.page-btn{min-height:40px;padding:0 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-weight:700}
.page-btn:disabled{opacity:.42;cursor:not-allowed}
.page-info{color:var(--muted);font-size:.84rem;font-weight:700}
.toast-wrap{position:fixed;top:78px;right:18px;z-index:100;display:grid;gap:8px;pointer-events:none}
.toast{max-width:min(360px,calc(100vw - 36px));background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);box-shadow:var(--shadow);padding:11px 14px;border-radius:9px;font-size:.84rem;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ai-fab{
  position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:70;width:56px;height:56px;border:0;border-radius:50%;
  color:white;background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 10px 28px rgba(79,70,229,.35);font-size:1.4rem
}
.ai-fab:hover{transform:translateY(-2px)}
.ai-panel{
  position:fixed;right:20px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;width:min(410px,calc(100vw - 28px));
  height:min(600px,calc(100dvh - 115px));display:none;flex-direction:column;overflow:hidden;background:var(--surface);
  border:1px solid var(--border);border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.38)
}
.ai-panel.open{display:flex;animation:panelIn .18s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--surface2);border-bottom:1px solid var(--border)}
.ai-brand{display:flex;gap:9px;align-items:center}
.ai-dot{width:10px;height:10px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(16,185,129,.12)}
.ai-sub{display:block;font-size:.68rem;color:var(--muted);font-weight:500;margin-top:2px}
.ai-head-actions{display:flex;gap:5px}
.ai-head-btn{border:0;background:transparent;color:var(--muted);padding:7px;border-radius:7px}
.ai-head-btn:hover{background:var(--surface3);color:var(--text)}
.chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
.msg{max-width:86%;padding:10px 12px;border-radius:12px;font-size:.84rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--primary);color:white;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.typing{display:none;align-self:flex-start;color:var(--muted);font-size:.76rem;padding:4px 10px}
.typing.show{display:block}
.ai-status{padding:7px 13px;color:var(--muted);font-size:.68rem;text-align:center;border-top:1px solid var(--border);display:none}
.ai-status.show{display:block}
.ai-foot{padding:10px;border-top:1px solid var(--border);background:var(--surface2)}
.ai-form{display:flex;gap:7px;align-items:flex-end}
.ai-input{flex:1;min-width:0;max-height:120px;resize:none;border:1px solid var(--border);border-radius:10px;padding:10px 11px;background:var(--surface);color:var(--text);line-height:1.35}
.ai-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.send{height:40px;padding:0 13px;border:0;border-radius:9px;background:var(--primary);color:white;font-weight:750}
.send:disabled{opacity:.5;cursor:not-allowed}
.ai-hint{text-align:center;color:var(--muted);font-size:.64rem;margin-top:6px}
@media(max-width:900px){
  header{grid-template-columns:1fr auto;gap:10px;padding:10px 14px}
  .logo{font-size:1.03rem}
  .search-wrap{grid-column:1/-1;grid-row:2}
  .app{display:block;padding:14px 12px 120px}
  .sidebar{position:static;margin-bottom:14px;padding:10px}
  .sidebar-head{margin-bottom:7px}
  .cat-list{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .cat-list::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;width:auto;white-space:nowrap;padding:8px 10px}
  .content-head{align-items:flex-start;flex-wrap:wrap}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .card{padding:14px;min-height:225px}
  .title{font-size:.96rem}
  .desc{font-size:.8rem}
  .ai-fab{right:14px}
  .ai-panel{right:10px;bottom:calc(80px + env(safe-area-inset-bottom));width:calc(100vw - 20px);height:min(570px,calc(100dvh - 98px))}
}
@media(max-width:560px){
  .header-actions{gap:5px}
  .icon-btn{width:39px;height:39px}
  .badge-pro{display:none}
  .grid{grid-template-columns:1fr}
  .card{min-height:0}
  .desc{margin-bottom:10px}
  .content-head{margin-bottom:10px}
  .controls{width:100%}
  .select{width:100%}
  .ai-fab{bottom:calc(14px + env(safe-area-inset-bottom))}
  .ai-panel{bottom:calc(78px + env(safe-area-inset-bottom));height:calc(100dvh - 96px);max-height:640px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<header>
  <div class="logo" aria-label="Nexus Hub">
    <span aria-hidden="true">⚡</span><span>Nexus Hub</span><span class="badge-pro">PRO v4</span>
  </div>
  <div class="search-wrap">
    <label class="sr-only" for="searchInput">Search resources</label>
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input id="searchInput" class="search" type="search" autocomplete="off"
      placeholder="Search tools, docs, calculators..." aria-label="Search resources">
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme" title="Toggle theme">◐</button>
    <button class="icon-btn" id="exportBtn" type="button" aria-label="Export favorites" title="Export favorites">⇩</button>
  </div>
</header>

<div class="app">
  <aside class="sidebar" aria-label="Resource categories">
    <div class="sidebar-head">
      <span class="sidebar-title">Categories</span>
    </div>
    <div class="cat-list" id="categoryList"></div>
  </aside>

  <main>
    <div class="content-head">
      <div class="result-count" id="resultCount" aria-live="polite"></div>
      <div class="controls">
        <label class="sr-only" for="sortSelect">Sort resources</label>
        <select id="sortSelect" class="select" aria-label="Sort resources">
          <option value="relevance">Best match</option>
          <option value="az">A–Z</option>
          <option value="za">Z–A</option>
          <option value="category">Category</option>
        </select>
      </div>
    </div>
    <section class="grid" id="toolsGrid" aria-live="polite"></section>
    <nav class="pagination" aria-label="Resource pages">
      <button class="page-btn" id="prevBtn" type="button">Previous</button>
      <span class="page-info" id="pageInfo">Page 1 of 1</span>
      <button class="page-btn" id="nextBtn" type="button">Next</button>
    </nav>
  </main>
</div>

<button class="ai-fab" id="aiFab" type="button" aria-label="Open AI Study Companion" aria-expanded="false" aria-controls="aiPanel">🤖</button>

<section class="ai-panel" id="aiPanel" role="dialog" aria-modal="false" aria-labelledby="aiTitle" aria-hidden="true">
  <div class="ai-head">
    <div class="ai-brand">
      <span class="ai-dot" aria-hidden="true"></span>
      <div><strong id="aiTitle">AI Study Companion</strong><span class="ai-sub" id="aiSub">Ready when your backend is connected</span></div>
    </div>
    <div class="ai-head-actions">
      <button class="ai-head-btn" id="clearChat" type="button" aria-label="Clear conversation" title="Clear conversation">⌫</button>
      <button class="ai-head-btn" id="closeAi" type="button" aria-label="Close AI assistant" title="Close">✕</button>
    </div>
  </div>
  <div class="chat" id="chatLog" tabindex="0">
    <div class="msg assistant">Hi! I'm your Nexus study assistant. Ask me about studying, programming, mathematics, research, or any resource on this hub.</div>
  </div>
  <div class="typing" id="typing">Assistant is thinking…</div>
  <div class="ai-status" id="aiStatus" role="status"></div>
  <div class="ai-foot">
    <form class="ai-form" id="aiForm">
      <label class="sr-only" for="aiInput">Message the AI</label>
      <textarea id="aiInput" class="ai-input" rows="1" maxlength="4000" placeholder="Ask a question…" aria-label="Message the AI"></textarea>
      <button class="send" id="sendBtn" type="submit">Send</button>
    </form>
    <div class="ai-hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</section>

    "url": "https://www.khanacademy.org/",

    "type": "Learning",
    "verified": true
  },
  {
    "id": 27,
    "title": "Google Scholar",

    "desc": "Search scholarly literature, papers, theses and academic publications.",
    "url": "https://scholar.google.com/",

  },
  {

    "title": "arXiv",

    "desc": "Open-access repository for research papers in science and computing.",
    "url": "https://arxiv.org/",

    "type": "Research",

  },
  {

  {

const state = {
  category: "All",
  query: "",
  page: 1,
  perPage: 12,
  sort: "relevance",
  favorites: loadFavorites(),
  aiBusy: false,
  aiAbort: null
};

const $ = id => document.getElementById(id);

function loadFavorites(){
  try{
    const parsed = JSON.parse(localStorage.getItem("nexus_favs_v4") || "[]");
    return Array.isArray(parsed) ? parsed.filter(Number.isInteger) : [];
  }catch{ return []; }
}
function saveFavorites(){
  try{ localStorage.setItem("nexus_favs_v4", JSON.stringify(state.favorites)); }catch{}
}
function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function safeUrl(value){
  try{
    const u = new URL(value);
    return ["http:","https:"].includes(u.protocol) ? u.href : "#";
  }catch{ return "#"; }
}
function showToast(message){
  const node = document.createElement("div");
  node.className = "toast";
  node.textContent = message;
  $("toastWrap").appendChild(node);
  setTimeout(()=>node.remove(), 3000);
}
function categoryCounts(){
  const counts = {All:allTools.length, Favorites:state.favorites.length};
  allTools.forEach(t => counts[t.category] = (counts[t.category] || 0) + 1);
  return counts;
}
function renderCategories(){
  const icons = {"All":"🌟","Favorites":"⭐","Programming":"💻","Math":"📐","Productivity":"⏱️","Physics":"⚛️","AI Tools":"🤖"};
  const counts = categoryCounts();
  const cats = ["All","Favorites","Programming","Math","Productivity","Physics","AI Tools"];
  $("categoryList").innerHTML = cats.map(cat => `
    <button class="cat ${state.category===cat ? "active":""}" type="button" data-cat="${escapeHtml(cat)}"
      aria-pressed="${state.category===cat}">
      <span>${icons[cat]} ${escapeHtml(cat==="All"?"All Resources":cat)}</span>
      <span class="count">${counts[cat] || 0}</span>
    </button>`).join("");
  document.querySelectorAll(".cat").forEach(btn=>{
    btn.addEventListener("click",()=>{
      state.category = btn.dataset.cat;
      state.page = 1;
      render();
    });
  });
}
function scoreTool(t){
  const q=state.query;
  if(!q) return 0;
  const fields=[t.title,t.category,t.desc,t.domain,t.type].map(x=>String(x).toLowerCase());
  let score=0;
  if(fields[0]===q) score+=100;
  if(fields[0].startsWith(q)) score+=50;
  fields.forEach((f,i)=>{
    if(f.includes(q)) score += i===0 ? 30 : 10;
  });
  return score;
}
function filteredTools(){
  let list=allTools.filter(t=>{
    const catOk=state.category==="All" || (state.category==="Favorites" ? state.favorites.includes(t.id) : t.category===state.category);
    const q=state.query;
    const qOk=!q || [t.title,t.category,t.desc,t.domain,t.type].some(v=>String(v).toLowerCase().includes(q));
    return catOk && qOk;
  });
  if(state.sort==="az") list.sort((a,b)=>a.title.localeCompare(b.title));
  else if(state.sort==="za") list.sort((a,b)=>b.title.localeCompare(a.title));
  else if(state.sort==="category") list.sort((a,b)=>a.category.localeCompare(b.category)||a.title.localeCompare(b.title));
  else if(state.query) list.sort((a,b)=>scoreTool(b)-scoreTool(a));
  return list;
}
function render(){
  renderCategories();
  const list=filteredTools();
  const pages=Math.max(1,Math.ceil(list.length/state.perPage));
  if(state.page>pages) state.page=pages;
  const start=(state.page-1)*state.perPage;
  const items=list.slice(start,start+state.perPage);
  $("resultCount").textContent=`${list.length} ${list.length===1?"resource":"resources"} found`;
  $("pageInfo").textContent=`Page ${state.page} of ${pages}`;
  $("prevBtn").disabled=state.page<=1;
  $("nextBtn").disabled=state.page>=pages;

  if(!items.length){
    $("toolsGrid").innerHTML=`<div class="empty"><strong>No matching resources</strong><br><span>Try a different search or category.</span></div>`;
    return;
  }
  $("toolsGrid").innerHTML=items.map(t=>{
    const fav=state.favorites.includes(t.id);
    const url=safeUrl(t.url);
    return `<article class="card">
      <div class="card-top">
        <span class="chip">${escapeHtml(t.category)}</span>
        <button class="fav ${fav?"active":""}" type="button" data-fav="${t.id}" aria-label="${fav?"Remove":"Add"} ${escapeHtml(t.title)} ${fav?"from":"to"} favorites" aria-pressed="${fav}">★</button>
      </div>
      <h2 class="title">${escapeHtml(t.title)}</h2>
      <p class="desc">${escapeHtml(t.desc)}</p>
      <div class="meta">
        <span class="chip">${escapeHtml(t.type || t.category)}</span>
        ${t.verified ? `<span class="chip verified">✓ Verified</span>` : ""}
        <span class="domain" title="${escapeHtml(t.domain||"")}">${escapeHtml(t.domain||"")}</span>
      </div>
      <a class="open" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Open ${escapeHtml(t.title)}</a>
    </article>`;
  }).join("");

  document.querySelectorAll("[data-fav]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id=Number(btn.dataset.fav);
      if(state.favorites.includes(id)){
        state.favorites=state.favorites.filter(x=>x!==id);
        showToast("Removed from Favorites");
      }else{
        state.favorites.push(id);
        showToast("Added to Favorites ⭐");
      }
      saveFavorites();
      render();
    });
  });
}
$("searchInput").addEventListener("input",e=>{
  state.query=e.target.value.toLowerCase().trim();
  state.page=1;
  render();
});
$("sortSelect").addEventListener("change",e=>{
  state.sort=e.target.value;
  state.page=1;
  render();
});
$("prevBtn").addEventListener("click",()=>{if(state.page>1){state.page--;render();scrollToMain();}});
$("nextBtn").addEventListener("click",()=>{state.page++;render();scrollToMain();});
function scrollToMain(){window.scrollTo({top:0,behavior:"smooth"});}

function setTheme(theme){
  document.documentElement.dataset.theme=theme;
  localStorage.setItem("nexus_theme_v4",theme);
}
function initTheme(){
  const saved=localStorage.getItem("nexus_theme_v4");
  const theme=saved || (matchMedia("(prefers-color-scheme:light)").matches ? "light":"dark");
  setTheme(theme);
}
$("themeBtn").addEventListener("click",()=>{
  const next=document.documentElement.dataset.theme==="light"?"dark":"light";
  setTheme(next);
  showToast(`Switched to ${next} mode`);
});
$("exportBtn").addEventListener("click",()=>{
  const favs=allTools.filter(t=>state.favorites.includes(t.id));
  if(!favs.length){showToast("No favorites to export");return;}
  const blob=new Blob([JSON.stringify(favs,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="nexus-favorites.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  showToast("Favorites exported");
});

const ai={
  panel:$("aiPanel"),fab:$("aiFab"),input:$("aiInput"),form:$("aiForm"),send:$("sendBtn"),
  log:$("chatLog"),typing:$("typing"),status:$("aiStatus")
};
function openAI(){
  ai.panel.classList.add("open");ai.panel.setAttribute("aria-hidden","false");ai.fab.setAttribute("aria-expanded","true");
  setTimeout(()=>ai.input.focus(),50);
}
function closeAI(){
  if(state.aiBusy) return;
  ai.panel.classList.remove("open");ai.panel.setAttribute("aria-hidden","true");ai.fab.setAttribute("aria-expanded","false");
}
ai.fab.addEventListener("click",()=>ai.panel.classList.contains("open")?closeAI():openAI());
$("closeAi").addEventListener("click",closeAI);
$("clearChat").addEventListener("click",()=>{
  if(state.aiBusy)return;
  ai.log.innerHTML=`<div class="msg assistant">Conversation cleared. What would you like to study?</div>`;
  ai.status.classList.remove("show");
  ai.input.focus();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && ai.panel.classList.contains("open")) closeAI();
});
function addMessage(text,type){
  const node=document.createElement("div");
  node.className=`msg ${type}`;
  node.textContent=text;
  ai.log.appendChild(node);
  ai.log.scrollTop=ai.log.scrollHeight;
  return node;
}
function setBusy(busy){
  state.aiBusy=busy;
  ai.send.disabled=busy;
  ai.input.disabled=busy;
  ai.typing.classList.toggle("show",busy);
  if(busy) ai.log.scrollTop=ai.log.scrollHeight;
}
function historyForBackend(){
  return [...ai.log.querySelectorAll(".msg")].map(n=>({
    role:n.classList.contains("user")?"user":"assistant",
    content:n.textContent
  })).slice(-20);
}
async function sendAIPrompt(){
  if(state.aiBusy)return;
  const text=ai.input.value.trim();
  if(!text)return;
  addMessage(text,"user");
  ai.input.value="";
  ai.input.style.height="auto";
  setBusy(true);
  ai.status.classList.remove("show");

  if(!AI_ENDPOINT){
    await new Promise(r=>setTimeout(r,250));
    addMessage("The AI backend is not connected yet. This version intentionally does not fake an answer. Set AI_ENDPOINT in the script to your own /api/chat backend; your API key should stay on that server.","assistant");
    setBusy(false);
    ai.input.disabled=false;
    ai.input.focus();
    return;
  }

  const controller=new AbortController();
  state.aiAbort=controller;
  const timer=setTimeout(()=>controller.abort(),30000);
  try{
    const response=await fetch(AI_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({message:text,history:historyForBackend()}),
      signal:controller.signal
    });
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    const answer=typeof data.answer==="string"?data.answer:
      typeof data.message==="string"?data.message:
      typeof data.output==="string"?data.output:"";
    if(!answer) throw new Error("Invalid AI response");
    addMessage(answer,"assistant");
  }catch(err){
    const msg=err.name==="AbortError"
      ?"The AI request timed out. Please try again."
      :"I couldn't reach the AI service. Check your backend and try again.";
    addMessage(msg,"assistant");
    ai.status.textContent="AI service unavailable";
    ai.status.classList.add("show");
  }finally{
    clearTimeout(timer);
    state.aiAbort=null;
    setBusy(false);
    ai.input.disabled=false;
    ai.input.focus();
  }
}
ai.form.addEventListener("submit",e=>{e.preventDefault();sendAIPrompt();});
ai.input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    ai.form.requestSubmit();
  }
});
ai.input.addEventListener("input",()=>{
  ai.input.style.height="auto";
  ai.input.style.height=Math.min(ai.input.scrollHeight,120)+"px";
});

initTheme();
render();
</script>
